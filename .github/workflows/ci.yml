# CareerOS — CI workflow (pull request validation + main-branch validation).
#
# Production deployment is NOT part of this workflow. It exercises only disposable,
# synthetic infrastructure created per job (pgvector/pgvector:pg17 service containers
# and local Docker volumes). No production credentials exist in this repository and
# none may be added to CI secrets.
#
# Triggers: pull_request, push(main), workflow_dispatch (manual, for release candidates).
# PR validation runs all required jobs. Merging requires the `release-gate` job.

name: CareerOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend / full suite (synthetic, disposable)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CAREEROS_CI_SYNTHETIC: "1"
      CAREEROS_CI_DATABASE_URL: postgresql://postgres:ci-not-a-secret@127.0.0.1:5432/postgres
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Ensure PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax / import check
        run: |
          python -m compileall -q backend
          python -c "import backend.app.main; print('import ok:', backend.app.main.app.title)"
      - name: Full backend test suite (synthetic CI database)
        working-directory: backend
        run: python -m pytest tests/ -q
      - name: Verify disposable fork teardown (hard fail on leaks)
        run: |
          LEFTOVER=$(PGPASSWORD=ci-not-a-secret psql -h 127.0.0.1 -U postgres -tAX \
            -c "SELECT datname FROM pg_database WHERE datname LIKE 'careeros_test_%';")
          if [ -n "$LEFTOVER" ]; then
            echo "FAIL: disposable test databases remain: $LEFTOVER"
            echo "Run: psql -h 127.0.0.1 -U postgres -c 'DROP DATABASE \"<name>\"' for each listed database."
            exit 1
          fi
          echo "teardown verified: no disposable databases remain"

  frontend:
    name: frontend / install, typecheck, tests, build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Vitest
        working-directory: frontend
        run: npx vitest run
      - name: TypeScript + production build
        working-directory: frontend
        run: npm run build
      - name: Lint (advisory; reported, not a release gate)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

  security:
    name: security / static checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: No committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|[.])' | grep -vE '\.example(\.local)?$|\.sample(\.local)?$'; then
            echo "FAIL: a .env file is tracked; it must never be committed"
            exit 1
          fi
          echo "ok: no .env file is tracked"
      - name: No production infrastructure references in source
        run: |
          if git grep -nE 'supabase\.(co|internal)|pooler\.supabase\.com' -- ':!docs' ':!*.md' ':!.taste-skill'; then
            echo "FAIL: production-infrastructure reference found"
            exit 1
          fi
          echo "ok: no production references in tracked source"
      - name: Migration authorization gates are present
        run: |
          grep -q -- '--authorize-production' backend/ops/migrate.py backend/ops/backfill_matches.py
          grep -q -- '--target' backend/ops/migrate.py backend/ops/backfill_matches.py
          grep -q 'CAREEROS_MIGRATION_AUTHORIZATION' deploy/.env.production.example
          echo "ok: migration gates present"
      - name: Backend image runs as non-root
        run: |
          grep -Eq '^USER [a-z]' deploy/Dockerfile.backend
          echo "ok: backend image drops privileges (USER set)"
      - name: Internal diagnostics endpoints are not publicly reachable
        run: |
          grep -q 'include_in_schema=False' backend/app/main.py
          grep -q 'CAREEROS_DIAGNOSTICS_TOKEN' backend/app/main.py
          echo "ok: internal endpoints are gated and unmounted from schema"
      - name: Secret-shape scan (never prints values)
        run: python .github/scripts/secret_scan.py

  docker:
    name: docker / build, seed and boot validation
    timeout-minutes: 40
    runs-on: ubuntu-latest
    env: {}
    steps:
      - uses: actions/checkout@v4
      - name: Compose configuration validation
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Compose configuration (with CI override)
        run: docker compose -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml config --quiet
      - name: Start disposable CI database (ci-db)
        run: docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml up -d --wait --wait-timeout 60 ci-db
      - name: Build and start stack
        run: docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml up -d --build
      - name: Wait for backend liveness
        run: |
          alive=0
          for i in $(seq 1 60); do
            if docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/api/health', timeout=5)" >/dev/null 2>&1; then
              echo "backend alive"
              alive=1
              break
            fi
            sleep 2
          done
          test "$alive" = "1" || { echo "backend never became alive"; exit 1; }
      - name: Seed synthetic data into the CI database using the backend image
        run: docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml exec -T backend python -m backend.app.testing.seed_ci_cli
      - name: Liveness, readiness, SPA fallback, unauthenticated API (expect 401)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)
          test "$code" = "200" && echo "health 200"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/ready)
          test "$code" = "200" && echo "ready 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/some/deep/route)" = "200" && echo "SPA fallback 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/opportunities)" = "401" && echo "unauthenticated API 401"
      - name: Authenticated read-only API paths (synthetic data)
        run: |
          TOKEN=$(docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml exec -T backend python -c 'from backend.app.core.auth import create_access_token; print(create_access_token(1))')
          auth="Authorization: Bearer $TOKEN"
          echo "opportunities HTTP: $(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:8080/api/opportunities)"
          echo "candidate   HTTP: $(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:8080/api/candidate)"
          echo "applications HTTP: $(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:8080/api/applications)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:8080/api/opportunities); test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:8080/api/candidate); test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" http://127.0.0.1:8080/api/applications); test "$code" = "200"
      - name: Request correlation header (X-Request-ID)
        run: |
          echo "X-Request-ID: $(curl -s -i http://127.0.0.1:8080/api/health | grep -i '^x-request-id:')"
          test -n "$(curl -s -i http://127.0.0.1:8080/api/health | grep -i '^x-request-id:')"
      - name: Internal diagnostics are not publicly accessible
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/internal/metrics)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/internal/diagnostics)" = "404"
      - name: Backend container runs as non-root (runtime check)
        run: |
          BACKEND_UID=$(docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml exec -T backend id -u)
          echo "backend uid=$BACKEND_UID"
          test "$BACKEND_UID" != "0"
      - name: Backend logs do not contain credential-shaped values
        run: |
          docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml logs backend --tail=200 > /tmp/careeros-ci-logs.txt
          if grep -E 'password|SECRET_KEY|TOKEN_SECRET|DATABASE_URL|postgres://|psql://' /tmp/careeros-ci-logs.txt; then
            echo "FAIL: credential-shaped values found in backend logs"; exit 1
          fi
          echo "log scan clean"
      - name: Graceful stop and restart recovery
        run: |
          docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml stop backend
          docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml start backend
          sleep 5
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/ready || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" && echo "ready 200 after restart"
      - name: Teardown (remove stack and disposable volume)
        if: always()
        run: |
          docker compose -p careeros-ci -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml down -v --rmi local --remove-orphans
          if docker volume ls -q | grep -q careeros-ci; then
            echo "FAIL: disposable CI volumes remain"
            exit 1
          fi
          echo "teardown verified: disposable stack and volume removed"

  release-gate:
    name: release gate (required, deployment NOT authorized)
    needs: [backend, frontend, security, docker]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Required checks must all have succeeded
        run: |
          set -e
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "docker:   ${{ needs.docker.result }}"
          test "${{ needs.backend.result }}" = "success" || exit 1
          test "${{ needs.frontend.result }}" = "success" || exit 1
          test "${{ needs.security.result }}" = "success" || exit 1
          test "${{ needs.docker.result }}" = "success" || exit 1
          test "${{ needs.security.result }}" != "skipped"
          test "${{ needs.docker.result }}" != "skipped"
          echo "All required checks passed. Production migration/deploy/backup operations remain operator-gated and are NOT granted by this workflow."
